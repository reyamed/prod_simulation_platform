version: '3.8'

services:
  # Database for Game Engine
  postgres:
    image: postgres:15
    container_name: elastic_sim_db
    environment:
      POSTGRES_USER: simuser
      POSTGRES_PASSWORD: simpassword
      POSTGRES_DB: elastic_simulator
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - elastic_sim_network

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elastic_sim_es
    environment:
      - node.name=elastic_sim_es
      - cluster.name=elastic-simulator-cluster
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false # Keep false for local simulator simplicity
      - xpack.license.self_generated.type=basic
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - elastic_sim_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I -u elastic:$${ELASTIC_PASSWORD:-changeme} http://localhost:9200 | grep -q 'HTTP/1.1 200 OK' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 120

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: elastic_sim_kibana
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic_sim_network

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: elastic_sim_logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - LS_JAVA_OPTS=-Xmx256m -Xms256m
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic_sim_network
    ports:
      - "5000:5000"

  # Engine Worker (Log Generator)
  worker:
    build:
      context: ./backend
    container_name: elastic_sim_worker
    command: ["python", "worker.py"]
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://simuser:simpassword@postgres:5432/elastic_simulator
      - ES_HOST=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - elastic_sim_network

  # Backend API
  backend:
    build:
      context: ./backend
    container_name: elastic_sim_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://simuser:simpassword@postgres:5432/elastic_simulator
      - ES_HOST=http://elasticsearch:9200
      - ES_USER=elastic
      - ES_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
    depends_on:
      postgres:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic_sim_network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
    container_name: elastic_sim_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - elastic_sim_network
    depends_on:
      - postgres
      - backend

volumes:
  postgres_data:
  es_data:

networks:
  elastic_sim_network:
    driver: bridge
